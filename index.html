<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c9ecf3">
  <title>Zıt Renk Oyunu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="acilis-ekrani" id="acilisEkrani" aria-label="EU Games açılış ekranı">
    <div class="acilis-guvenli-alan">
      <div class="acilis-icerik">
        <img class="eu-logo" src="images/eu-games-logo.png" alt="EU Games">
        <button class="devam-dokun" id="devamDokun" type="button" aria-label="Devam etmek için dokun">
          <img src="images/devam-etmek-icin-dokun.png" alt="Devam etmek için dokun">
        </button>
      </div>
    </div>
  </section>

  <section class="oyun-logo-ekrani" id="oyunLogoEkrani" aria-label="Zıt Renk Oyunu logosu" hidden>
    <img class="oyun-acilis-logosu" src="images/zit-renk-oyunu-logo.png?v=2" alt="Zıt Renk Oyunu">
  </section>

  <section class="tanitim-video-ekrani" id="tanitimVideoEkrani" aria-label="Oyun tanıtım videosu" hidden>
    <video id="tanitimVideosu" preload="auto" playsinline>
      <source src="videos/oyun-tanitim.mp4" type="video/mp4">
    </video>
    <button class="tanitim-atla" id="tanitimAtla" type="button">ATLA →</button>
  </section>

  <section class="ana-menu-ekrani" id="anaMenuEkrani" aria-label="Ana menü" hidden inert>
    <img class="ana-menu-arkaplan" src="images/acilis-arka-plan.png?v=2" alt="">
    <div class="sabit-ekran-alani ana-menu-guvenli-alan">
    <img class="ana-menu-yazi-logo" src="images/oyun-yazi-logo.png" alt="Zıt Renk Oyunu">
    <img class="menu-mikrop menu-mikrop-sol-ust" src="images/menu-mikrop-sol-ust.png" alt="" aria-hidden="true">
    <img class="menu-mikrop menu-mikrop-sol-alt" src="images/menu-mikrop-sol-alt.png" alt="" aria-hidden="true">
    <img class="menu-mikrop menu-mikrop-sag-ust" src="images/menu-mikrop-sag-ust.png" alt="" aria-hidden="true">
    <img class="menu-mikrop menu-mikrop-sag-alt" src="images/menu-mikrop-sag-alt.png" alt="" aria-hidden="true">

    <nav class="ana-menu-butonlari" aria-label="Ana menü seçenekleri">
      <button id="menuStart" type="button" data-normal="images/buton-start.png" data-basilmis="images/buton-start-basilmis.png"><img src="images/buton-start.png" alt="Start"></button>
      <button id="menuNasil" type="button" data-normal="images/buton-how-to-play.png" data-basilmis="images/buton-how-to-play-basilmis.png"><img src="images/buton-how-to-play.png" alt="How to Play"></button>
      <button id="menuCredits" type="button" data-normal="images/buton-credits.png" data-basilmis="images/buton-credits-basilmis.png"><img src="images/buton-credits.png" alt="Credits"></button>
    </nav>

    <div class="menu-bilgi-perdesi" id="menuBilgiPerdesi" hidden>
      <div class="menu-bilgi-karti">
        <h2 id="menuBilgiBaslik"></h2>
        <p id="menuBilgiMetin"></p>
        <img class="menu-bilgi-gorseli" id="menuBilgiGorsel" alt="Nasıl oynanır?" hidden>
        <button id="menuBilgiKapat" type="button">GERİ</button>
      </div>
    </div>
    </div>
  </section>

  <main class="sahne" aria-label="Zıt Renk Oyunu">
    <section class="guvenli-alan">
      <header class="baslik-alani">
        <p id="turYazisi" aria-live="polite">Oyuncu 1'in sırası</p>
        <button class="otomatik-buton" id="otomatikOyna" type="button">▶ Otomatik Oyna</button>
        <span class="test-durumu" id="testDurumu"></span>
        <span class="sure" id="sureGostergesi" aria-label="Kalan süre">05:00</span>
      </header>

      <section class="oyuncu oyuncu-erkek aktif" id="erkekPanel">
        <div class="skor" id="erkekSkor" aria-label="Oyuncu 1 skoru"></div>
        <div class="mikrop-yuvasi" id="erkekMikrop"></div>
        <div class="karakter">
          <img id="oyuncu1Karakter" data-karakter-id="erkek-01" src="images/karakter-erkek-01-oyun.png" alt="Oyuncu 1 karakteri">
        </div>
      </section>

      <section class="oyun-merkezi">
        <div class="mikrop-kubbesi" aria-label="Aktif renk mikrobu">
          <img class="mikrop-kubbesi-cerceve" src="images/mikrop-kubbesi.png" alt="">
          <div class="kubbe-mikrop-yuvasi" id="kubbeMikrop"></div>
        </div>
        <div class="gorev" id="gorevYazisi">Mikrobun zıt rengini bul!</div>
        <div class="grid" id="sabunGrid" aria-label="8 çarpı 8 sabun alanı"></div>
        <div class="bildirim" id="bildirim" aria-live="assertive"></div>
      </section>

      <section class="oyuncu oyuncu-kiz pasif" id="kizPanel">
        <div class="skor" id="kizSkor" aria-label="Oyuncu 2 skoru"></div>
        <div class="mikrop-yuvasi" id="kizMikrop"></div>
        <div class="karakter">
          <img id="oyuncu2Karakter" data-karakter-id="erkek-02" src="images/karakter-erkek-02-oyun.png" alt="Oyuncu 2 karakteri">
        </div>
      </section>

    </section>

    <button class="oyun-ust-gecis-buton oyun-mod-buton" id="oyunModEkrani" type="button">← Mod Ekranı</button>
    <button class="oyun-ust-gecis-buton oyun-ana-menu-buton" id="oyunAnaMenu" type="button">Ana Menü →</button>

    <div class="sonuc-perdesi" id="sonucPerdesi" hidden>
      <div class="sonuc-karti">
        <h2 id="sonucBaslik"></h2>
        <p id="sonucMetin"></p>
        <div class="video-yeri" id="videoYeri" hidden></div>
        <div class="sonuc-butonlari">
          <button id="yenidenBaslat" type="button">Aynı Modda Oyna</button>
          <button id="modSecimineDon" class="ikincil" type="button">Mod Seç</button>
          <button id="anaMenuyeDon" class="ikincil" type="button">Ana Menüye Dön</button>
        </div>
      </div>
    </div>
  </main>

  <section class="kaybetme-sahnesi" id="kaybetmeSahnesi" aria-label="Mikroplardan kaçış sahnesi" hidden>
    <div class="kaybetme-karakter-hareket">
      <img class="kaybetme-karakter" src="images/karakter-erkek-01-kosu-sprite.png" alt="Mikroplardan kaçan Alp">
    </div>
    <img class="kovalayan-mikrop kovalayan-mikrop-1" src="images/mikrop-mor.png" alt="">
    <img class="kovalayan-mikrop kovalayan-mikrop-2" src="images/mikrop-yesil.png" alt="">
    <img class="kovalayan-mikrop kovalayan-mikrop-3" src="images/mikrop-turuncu.png" alt="">
    <img class="kovalayan-mikrop kovalayan-mikrop-4" src="images/mikrop-kirmizi.png" alt="">
    <img class="kovalayan-mikrop kovalayan-mikrop-5" src="images/mikrop-mavi.png" alt="">
    <img class="kovalayan-mikrop kovalayan-mikrop-6" src="images/mikrop-sari.png" alt="">
    <button class="kaybetme-ana-menu" id="kaybetmeAnaMenu" type="button">Ana Menüye Dön</button>
  </section>

  <div class="mod-perdesi" id="modPerdesi">
    <div class="sabit-ekran-alani perde-guvenli-alan">
    <div class="mod-karti">
      <span class="mod-ust-etiket">ZIT RENK OYUNU</span>
      <h2>OYUN MODUNU SEÇ</h2>
      <p>Oynamak istediğiniz modu seçin.</p>
      <div class="mod-butonlari">
        <button class="mod-gorsel-butonu" type="button" data-mod="normal" data-normal="images/buton-normal-mod.png" data-basilmis="images/buton-normal-mod-basilmis.png">
          <img src="images/buton-normal-mod.png" alt="Normal Mod">
          <span class="mod-gorsel-etiket">NORMAL MOD</span>
        </button>
        <button class="mod-gorsel-butonu" type="button" data-mod="bilgisayar">
          <img src="images/buton-bilgisayara-karsi.png" alt="Bilgisayara Karşı">
          <span class="mod-gorsel-etiket">BİLGİSAYARA KARŞI</span>
        </button>
      </div>
      <button class="mod-geri" id="modGeri" type="button">← ANA MENÜYE DÖN</button>
    </div>
    </div>
  </div>

  <div class="karakter-secim-perdesi" id="karakterSecimPerdesi" hidden>
    <div class="sabit-ekran-alani perde-guvenli-alan">
    <div class="karakter-secim-karti">
      <h2 id="karakterSecimBaslik">OYUNCU 1 KARAKTERİNİ SEÇ</h2>
      <p id="karakterSecimAciklama">Oyun boyunca kullanmak istediğin karaktere dokun.</p>
      <div class="karakter-listesi" id="karakterListesi"></div>
      <div class="karakter-secim-alt-butonlar">
        <button class="karakter-oyuna-gec" id="karakterOyunaGec" type="button" hidden>OYUNA GEÇ</button>
        <button class="karakter-secim-geri" id="karakterSecimGeri" type="button">← MOD EKRANINA DÖN</button>
      </div>
    </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
